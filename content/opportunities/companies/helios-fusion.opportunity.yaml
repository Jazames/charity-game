schema_version: 1
id: company.helios-fusion
category: company
name: Helios Fusion Works
status: published

tags:
  - energy
  - speculative
  - fusion

availability:
  first_day: 1
  last_day: 20

dossier:
  summary: A long-shot demonstration plant with transformative potential.
  body_markdown: |
    Helios proposes a demonstration-scale fusion power plant using a new magnet
    design. No commercial reactor using this approach has been completed.

    The engineering review finds the design internally consistent but warns that
    the company needs at least **$4 billion committed by day 12** to order the
    specialized magnets in time. A smaller or later investment will leave an
    incomplete plant and little salvage value.

rules:
  disposition: speculative
  world_effects:
    world_wellbeing: 12
    clean_energy: 15
  holding:
    initial_value_ratio: 1
    success_value_ratio: 3.5
    failure_value_ratio: 0.08
  success:
    all:
      - minimum_total_allocation_dollars: 4000000000
      - committed_by_day: 12

initial_coverage:
  - id: ordinary
    priority: 10
    when:
      always: true
    headline: Church takes long-shot position in fusion developer
    body_markdown: |
      The investment gives the church a substantial holding in an experimental
      energy company. Analysts described the project as potentially important
      but far from commercially proven.

memos:
  - id: ignition-confirmed
    priority: 40
    when:
      success_conditions_met: true
    deliver_after_days: 8
    related_extra: profitable-breakthrough
    subject: Helios test result confirmed
    body_markdown: |
      Independent observers have verified the demonstration. Public disclosure
      is expected tomorrow, and the institution's holding will appreciate
      substantially.
  - id: magnet-contract-lost
    priority: 40
    when:
      success_conditions_met: false
    deliver_after_days: 8
    related_extra: failed-project
    subject: Helios construction program terminated
    body_markdown: |
      The company missed the magnet order window. Management does not have a
      credible path to complete the plant with the capital and time remaining.

extras:
  - id: profitable-breakthrough
    priority: 40
    when:
      success_conditions_met: true
    publish_after_days: 9
    headline: Church reaps enormous gain from energy breakthrough
    body_markdown: |
      Helios has demonstrated its reactor design, sharply increasing the value
      of the church's holding. Critics questioned whether a tax-exempt religious
      institution should profit so heavily from essential energy technology.
  - id: failed-project
    priority: 40
    when:
      success_conditions_met: false
    publish_after_days: 9
    headline: Billions stranded in church fusion gamble
    body_markdown: |
      Helios has halted construction after failing to secure critical equipment.
      The church's speculative holding is now valued at a fraction of its cost.

effects:
  - when:
      success_conditions_met: true
    manifest_after_days: 1
    apply:
      world_wellbeing: 12
      clean_energy: 15
      holding_value_ratio: 3.5
      pr: -2
  - when:
      success_conditions_met: false
    manifest_after_days: 1
    apply:
      world_wellbeing: 0
      holding_value_ratio: 0.08
      pr: -7
      leadership_confidence: -5
